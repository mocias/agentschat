<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>agentschat</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/chat-layout.css"><script defer src="/app.js"></script></head>
<body>
<main class="shell">
  <nav class="app-rail" aria-label="主导航">
    <div class="rail-brand" title="agentschat" aria-label="agentschat"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11a8 8 0 0 1-8 8H8l-5 3 1.5-5A8 8 0 1 1 21 11Z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg></div>
    <button class="rail-button selected" data-filter="all" title="全部聊天" aria-label="全部聊天" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11a8 8 0 0 1-8 8H8l-5 3 1.5-5A8 8 0 1 1 21 11Z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg></button>
    <button class="rail-button" data-filter="direct" title="Agents" aria-label="Agents" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="7" r="3.5"/><path d="M3 21v-2a7 7 0 0 1 14 0v2H3ZM18 7h3m-3 4h3m-1 4h1"/></svg></button>
    <button class="rail-button" data-filter="group" title="群聊" aria-label="群聊" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M2 20v-2a7 7 0 0 1 14 0v2H2M16 4a3 3 0 0 1 0 6m2 3a6 6 0 0 1 4 5v2"/></svg></button>
    <button id="history-all" class="rail-button" title="搜索聊天记录" aria-label="搜索聊天记录"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6m3-3v5l3 2"/></svg></button>
    <div class="rail-spacer"></div>
    <button id="backends" class="rail-button" title="后端管理" aria-label="后端管理"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5v9l-9 5-9-5V8Zm0 9 9-4M3 8l9 4v10m-4-16 9 5"/></svg></button>
    <button id="settings" class="rail-button" title="外观设置" aria-label="外观设置"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </nav>
  <aside class="sidebar">
    <header class="sidebar-title"><strong>agentschat</strong><span id="list-view-label">聊天</span></header>
    <div class="search-row"><label class="search"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="搜索 Agent 或群聊" aria-label="搜索 Agent 或群聊"></label><button id="add-agent" class="square" title="添加 Agent" aria-label="添加 Agent">＋</button></div>
    <div class="list-heading"><span class="list-caption">会话与工作区</span><button id="new-group" class="text-button" title="创建群聊">发起群聊</button></div>
    <nav id="conversations" aria-label="会话列表"></nav>
    <footer class="sidebar-footer"><span id="connection"><i></i>正在连接</span><span class="local-note">本地保存</span></footer>
  </aside>
  <section class="chat" id="chat">
    <div class="welcome" id="welcome"><div class="welcome-mark"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11a8 8 0 0 1-8 8H8l-5 3 1.5-5A8 8 0 1 1 21 11Z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg></div><h1>agentschat</h1><p>和你的 AI 伙伴，开始一段对话。</p><button id="welcome-add" class="primary">＋ 添加第一个 Agent</button><div class="backend-badges" aria-label="支持的后端"><span>Codex</span><span>DSH</span><span>Qoder</span><span>Claude Code</span><span>WorkBuddy</span></div></div>
    <div id="conversation-view" hidden>
      <header class="chat-header"><div><h1 id="chat-title"></h1><p id="chat-subtitle"></p></div><div class="header-actions"><button id="history-current" class="text-button" title="搜索和导出当前聊天记录">聊天记录</button><button id="new-session" class="text-button" hidden>＋ 新会话</button><button id="session-actions" class="square" aria-label="会话管理" title="会话管理" hidden>⋯</button><span class="chat-tag">CHAT</span><button id="group-actions" class="square" title="群聊管理" aria-label="群聊管理" hidden>⋯</button><button id="members" class="square" title="查看成员" aria-label="查看成员">☷</button></div></header>
      <div id="messages" class="messages" aria-live="polite"></div><section id="approval-panel" aria-label="待确认操作" hidden></section>
      <section class="composer"><div id="harness-context" hidden><button id="composer-workspace" class="composer-chip" title="Agent 工作区"></button><button id="composer-mode" class="composer-chip" aria-label="选择会话预设" aria-haspopup="menu"></button></div><div class="composer-tools"><button id="composer-permission" class="composer-chip" aria-label="选择会话权限" aria-haspopup="menu" hidden></button><button id="attach" class="tool-button" title="引用文件或图片" aria-label="文件 / 图片"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h6l2 3h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Zm0 3h18"/></svg><span>文件 / 图片</span></button><button id="mention" class="tool-button" title="提及 Agent" aria-label="提及 Agent"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v6a2 2 0 0 0 4 0v-2a8 8 0 1 0-3 6.25"/></svg><span>提及</span></button><div class="tools-dropdown"><button id="tools-toggle" class="tool-button" title="会话工具" aria-label="会话工具" aria-haspopup="menu" aria-expanded="false" aria-controls="tools-menu"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>工具</span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button><div id="tools-menu" role="menu" aria-label="会话工具" hidden><div class="tools-menu-heading">会话工具</div><button id="alarms" type="button" role="menuitem"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M3 4l3-2m12 0 3 2M5 20l-1 2m15-2 1 2"/></svg><span>闹钟<small>定时提醒与已设闹钟</small></span></button></div></div><span id="activity" role="status" aria-live="polite"></span><button id="stop" hidden>停止回复</button></div><div id="attachments" class="attachments"></div><textarea id="draft" placeholder="发条消息，聊聊你的想法…" aria-label="消息内容"></textarea><div id="harness-options" hidden><button id="composer-model" class="composer-chip"></button><button id="composer-effort" class="composer-chip" aria-label="调整当前会话推理强度"></button></div><footer><span>Enter 发送 · Shift + Enter 换行</span><button id="send" class="primary">发送 <span>↗</span></button></footer></section>
    </div>
  </section>
</main>
<input id="file-input" type="file" multiple hidden>
<dialog id="modal"><form id="modal-form"><header><h2 id="modal-title"></h2><button type="button" id="close-modal" class="square" aria-label="关闭弹窗">×</button></header><div id="modal-content"></div><p id="modal-error" role="alert"></p><footer id="modal-footer"><button type="button" id="cancel-modal">取消</button><button id="modal-submit" class="primary" type="submit">确定</button></footer></form></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
